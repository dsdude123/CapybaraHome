name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - name: Test and collect coverage
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --settings .github/coverage.runsettings
          --results-directory ${{ runner.temp }}/coverage

      - name: Keep this branch's coverage as the baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.ref_name }}
          path: ${{ runner.temp }}/coverage/**/*.cobertura.xml
          retention-days: 90
          if-no-files-found: error

      - name: Fetch the base branch's coverage
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          name="coverage-${BASE_REF//\//-}"
          target="${RUNNER_TEMP}/coverage-base"
          mkdir -p "$target"
          runs=$(gh run list --workflow build.yml --branch "$BASE_REF" --event push \
            --status success --limit 10 --json databaseId --jq '.[].databaseId' || true)
          for id in $runs; do
            if gh run download "$id" --name "$name" --dir "$target"; then
              echo "Baseline taken from run $id."
              break
            fi
          done

      - name: Build the coverage report
        if: github.event_name == 'pull_request'
        run: >
          python3 .github/scripts/coverage_report.py
          --head ${{ runner.temp }}/coverage
          --base ${{ runner.temp }}/coverage-base
          --base-label ${{ github.event.pull_request.base.ref }}
          --out ${{ runner.temp }}/coverage.md

      - name: Comment the coverage report on the pull request
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY_FILE: ${{ runner.temp }}/coverage.md
        run: |
          jq -Rs '{body: .}' "$BODY_FILE" > "${RUNNER_TEMP}/comment.json"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- capybarahome-coverage -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input "${RUNNER_TEMP}/comment.json" --jq .html_url
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
              --input "${RUNNER_TEMP}/comment.json" --jq .html_url
          fi

      - name: Add the coverage report to the run summary
        if: github.event_name == 'pull_request'
        run: cat ${{ runner.temp }}/coverage.md >> "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build, and push on a push to main
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
