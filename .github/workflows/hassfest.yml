name: Home Assistant integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'tests/homeassistant/**'
      - '.github/workflows/hassfest.yml'

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r tests/homeassistant/requirements.txt ruff

      - run: ruff check custom_components tests/homeassistant

      - run: ruff format --check custom_components tests/homeassistant

      - run: python -m pytest tests/homeassistant
